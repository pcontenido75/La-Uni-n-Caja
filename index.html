<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>La Unión M&J - Caja POS Nube</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="text/javascript" src="https://unpkg.com/@zxing/library@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    #videoContainer { position: relative; background: #000; overflow: hidden; border-radius: 16px; }
    #videoElement { width: 100%; height: 190px; object-fit: cover; }
    .laser { position: absolute; top: 50%; left: 5%; right: 5%; height: 2px; background: #ef4444; box-shadow: 0 0 10px 2px #ef4444; transform: translateY(-50%); pointer-events: none; }
    .scan-area { position: absolute; top: 20%; bottom: 20%; left: 8%; right: 8%; border: 1.5px dashed rgba(245, 158, 11, 0.6); border-radius: 10px; pointer-events: none; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans select-none pb-12">

  <header class="bg-slate-800 border-b border-slate-700 px-4 py-2 flex items-center justify-between sticky top-0 z-50">
    <div class="flex items-center gap-2">
      <span class="bg-amber-500 text-slate-950 font-black px-2 py-0.5 rounded text-sm">S1</span>
      <div>
        <h1 class="text-sm font-bold text-white leading-tight">La Unión M&J</h1>
        <p class="text-[10px] text-emerald-400 font-bold" id="cloudStatus">● Conectando a la Nube...</p>
      </div>
    </div>
    <div class="flex items-center gap-1.5 bg-slate-900 px-2.5 py-1 rounded-lg border border-slate-700">
      <span class="text-xs text-amber-400 font-semibold">Tasa Bs:</span>
      <input id="rateInput" type="number" step="0.1" class="w-16 bg-transparent text-right text-xs font-bold text-white outline-none" value="900" onchange="updateRate()">
    </div>
  </header>

  <div class="grid grid-cols-2 bg-slate-800 p-1 mx-3 my-2 rounded-xl border border-slate-700">
    <button id="tabVenta" onclick="switchView('venta')" class="py-2 text-xs font-black rounded-lg bg-amber-500 text-slate-950">
      🛒 CAJA / VENTA
    </button>
    <button id="tabCarga" onclick="switchView('carga')" class="py-2 text-xs font-semibold rounded-lg text-slate-300">
      📦 AGREGAR PRODUCTOS
    </button>
  </div>

  <section class="px-3 mb-2">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-2.5 shadow-lg">
      <div id="videoContainer">
        <video id="videoElement" autoplay playsinline muted></video>
        <div id="laserLine" class="laser"></div>
        <div class="scan-area"></div>
      </div>
      <div class="flex items-center justify-between mt-2 px-1 text-[11px]">
        <span id="scanStatus" class="text-emerald-400 font-semibold">● Escáner continuo activo</span>
        <button id="btnTorch" onclick="toggleTorch()" class="bg-slate-700 px-2.5 py-1 rounded-lg text-amber-300 font-bold hidden">
          🔦 Linterna
        </button>
      </div>
    </div>
  </section>

  <main id="viewVenta" class="px-3 flex-1 flex flex-col space-y-2">
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-2 flex gap-2">
      <input id="manualCodeInput" type="text" placeholder="Código o nombre (ej. 1, Polar...)" 
             class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white outline-none focus:border-amber-500"
             onkeydown="if(event.key === 'Enter') addManualProduct()">
      <button onclick="addManualProduct()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-3 py-1.5 rounded-lg text-xs">
        + Sumar
      </button>
    </div>

    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-3 flex-1 flex flex-col">
      <div class="flex justify-between items-center pb-2 border-b border-slate-700 text-[11px] text-slate-400 font-bold uppercase">
        <span>Producto</span>
        <span>Cant. / Total</span>
      </div>
      <div id="cartList" class="flex-1 divide-y divide-slate-700/60 overflow-y-auto max-h-44 py-1">
        <div class="text-center text-slate-500 text-xs py-6">Pasa el producto por la cámara o escribe su código arriba.</div>
      </div>
      <div class="mt-2 pt-2 border-t border-slate-700 bg-slate-900/70 p-2.5 rounded-xl space-y-1">
        <div class="flex justify-between items-baseline">
          <span class="text-xs text-slate-300 font-semibold">Total a Cobrar:</span>
          <span class="text-2xl font-black text-amber-400">$<span id="txtUSD">0.00</span></span>
        </div>
        <div class="flex justify-between items-baseline text-xs text-slate-400">
          <span>En Bolívares:</span>
          <span class="text-sm font-bold text-slate-200">Bs <span id="txtBS">0.00</span></span>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2 mt-2">
        <button onclick="resetCart()" class="py-2.5 px-3 bg-slate-700 rounded-xl text-xs font-bold text-slate-300">Limpiar Todo</button>
        <button onclick="finishSale()" class="py-2.5 px-3 bg-emerald-600 rounded-xl text-xs font-black text-white shadow-lg">COBRAR</button>
      </div>
    </div>
  </main>

  <section id="viewCarga" class="px-3 flex-1 flex flex-col hidden space-y-3">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-3.5 space-y-3">
      <div class="flex justify-between items-center">
        <p class="text-xs text-amber-400 font-bold uppercase">Registrar en la Nube</p>
        <button onclick="generarCodigoSinBarra()" class="text-[11px] bg-slate-700 hover:bg-slate-600 text-amber-300 px-2 py-0.5 rounded-lg border border-slate-600">
          ⚡ Sin Código de Barra
        </button>
      </div>

      <div class="space-y-2">
        <div>
          <label class="text-[11px] font-semibold text-slate-400 block mb-0.5">Código (Escanear o escribir número)</label>
          <input id="inCode" type="text" placeholder="Ej. 1 para Caja de Cerveza o escanea..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs font-mono text-amber-300 outline-none">
        </div>
        <div>
          <label class="text-[11px] font-semibold text-slate-400 block mb-0.5">Nombre del Producto / Licor</label>
          <input id="inName" type="text" placeholder="Ej. Caja Polar Pilsen 36u / Ron Cacique" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white outline-none">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[11px] font-semibold text-slate-400 block mb-0.5">Costo ($ USD)</label>
            <input id="inCost" type="number" step="0.01" placeholder="0.00" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white outline-none">
          </div>
          <div>
            <label class="text-[11px] font-semibold text-amber-400 block mb-0.5">Precio Venta ($ USD)</label>
            <input id="inPrice" type="number" step="0.01" placeholder="0.00" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs font-bold text-amber-300 outline-none">
          </div>
        </div>
      </div>
      <button onclick="saveItem()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-2.5 rounded-xl text-xs shadow">
        GUARDAR PARA TODOS LOS CELULARES
      </button>
    </div>
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-3 flex-1 flex flex-col">
      <span class="text-xs font-bold text-slate-300 mb-2">Inventario en la Nube (<span id="countStock">0</span>)</span>
      <div id="stockList" class="flex-1 overflow-y-auto max-h-48 divide-y divide-slate-700/60 text-xs"></div>
    </div>
  </section>
    <script>
    const FIREBASE_DATABASE_URL = "https://licoreria-la-union-default-rtdb.firebaseio.com/";

    let db = null;
    try {
      firebase.initializeApp({ databaseURL: FIREBASE_DATABASE_URL });
      db = firebase.database();
    } catch (e) {
      console.error(e);
    }

    let codeReader = null;
    let currentStream = null;
    let track = null;
    let torchOn = false;
    let currentTab = 'venta';
    let rate = 900.0;
    let catalog = {};
    let cart = [];

    const nativeBarcodeDetector = ('BarcodeDetector' in window) 
      ? new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39'] }) 
      : null;

    function beep() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = 1050;
        gain.gain.value = 0.25;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.09);
      } catch (e) {}
    }

    document.addEventListener("DOMContentLoaded", () => {
      if (db) {
        db.ref('catalogo').on('value', (snapshot) => {
          catalog = snapshot.val() || {};
          renderStock();
          document.getElementById('cloudStatus').textContent = "● Nube Activa (Multidispositivo)";
        });
        db.ref('tasa').on('value', (snapshot) => {
          if (snapshot.val()) {
            rate = parseFloat(snapshot.val());
            document.getElementById('rateInput').value = rate;
            renderCart();
          }
        });
      }
      startHDScanner();
    });

    function updateRate() {
      const v = parseFloat(document.getElementById('rateInput').value);
      if (!isNaN(v) && v > 0) {
        rate = v;
        if (db) db.ref('tasa').set(rate);
        renderCart();
      }
    }

    function switchView(tab) {
      currentTab = tab;
      const tV = document.getElementById('tabVenta');
      const tC = document.getElementById('tabCarga');
      const vV = document.getElementById('viewVenta');
      const vC = document.getElementById('viewCarga');

      if (tab === 'venta') {
        tV.className = "py-2 text-xs font-black rounded-lg bg-amber-500 text-slate-950";
        tC.className = "py-2 text-xs font-semibold rounded-lg text-slate-300";
        vV.classList.remove('hidden');
        vC.classList.add('hidden');
      } else {
        tC.className = "py-2 text-xs font-black rounded-lg bg-amber-500 text-slate-950";
        tV.className = "py-2 text-xs font-semibold rounded-lg text-slate-300";
        vV.classList.remove('hidden');
        vC.classList.add('hidden');
      }
    }

    async function startHDScanner() {
      const video = document.getElementById('videoElement');
      const hints = new Map();
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
        ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
        ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E,
        ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39
      ]);
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

      codeReader = new ZXing.BrowserMultiFormatReader(hints);

      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { min: 1280, ideal: 1920 } },
          audio: false
        });
        video.srcObject = currentStream;
        await video.play();

        track = currentStream.getVideoTracks()[0];
        const capabilities = track.getCapabilities ? track.getCapabilities() : {};
        if (capabilities.torch) {
          document.getElementById('btnTorch').classList.remove('hidden');
        }

        if (nativeBarcodeDetector) {
          setInterval(async () => {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
              try {
                const barcodes = await nativeBarcodeDetector.detect(video);
                if (barcodes.length > 0) handleScannedBarcode(barcodes[0].rawValue);
              } catch (e) {}
            }
          }, 150);
        }

        codeReader.decodeFromVideoElement(video, (result) => {
          if (result) handleScannedBarcode(result.getText());
        });
      } catch (err) {
        codeReader.decodeFromVideoDevice(null, 'videoElement', (result) => {
          if (result) handleScannedBarcode(result.getText());
        });
      }
    }

    async function toggleTorch() {
      if (track && track.applyConstraints) {
        torchOn = !torchOn;
        try {
          await track.applyConstraints({ advanced: [{ torch: torchOn }] });
          document.getElementById('btnTorch').textContent = torchOn ? "🔦 Apagar" : "🔦 Linterna";
        } catch (e) {}
      }
    }

    function addManualProduct() {
      const input = document.getElementById('manualCodeInput');
      const val = input.value.trim();
      if (!val) return;

      if (catalog[val]) {
        handleScannedBarcode(val);
        input.value = "";
        return;
      }

      const foundCode = Object.keys(catalog).find(k => 
        catalog[k].name.toLowerCase().includes(val.toLowerCase())
      );

      if (foundCode) {
        handleScannedBarcode(foundCode);
        input.value = "";
      } else {
        alert(`No se encontró: "${val}"`);
      }
    }

    function generarCodigoSinBarra() {
      let nextId = 1;
      while (catalog[nextId.toString()]) {
        nextId++;
      }
      document.getElementById('inCode').value = nextId;
      document.getElementById('inName').focus();
    }

    let lastCode = "";
    let lastTime = 0;

    function handleScannedBarcode(code) {
      const now = Date.now();
      if (code === lastCode && (now - lastTime) < 1300) return;
      lastCode = code;
      lastTime = now;
      beep();

      const status = document.getElementById('scanStatus');

      if (currentTab === 'venta') {
        if (catalog[code]) {
          const item = catalog[code];
          const exist = cart.find(c => c.code === code);
          if (exist) exist.qty++;
          else cart.push({ code: code, name: item.name, price: item.price, qty: 1 });
          renderCart();
          status.innerHTML = `<span class="text-emerald-400 font-black">✔ Sumado: ${item.name}</span>`;
        } else {
          status.innerHTML = `<span class="text-amber-400 font-bold">⚠ No registrado (${code})</span>`;
          if (confirm(`El código [${code}] es nuevo. ¿Registrarlo ahora?`)) {
            switchView('carga');
            document.getElementById('inCode').value = code;
            document.getElementById('inName').focus();
          }
        }
      } else {
        document.getElementById('inCode').value = code;
        if (catalog[code]) {
          const p = catalog[code];
          document.getElementById('inName').value = p.name;
          document.getElementById('inCost').value = p.cost;
          document.getElementById('inPrice').value = p.price;
          status.innerHTML = `<span class="text-amber-400 font-bold">Producto cargado para editar</span>`;
        } else {
          document.getElementById('inName').value = "";
          document.getElementById('inCost').value = "";
          document.getElementById('inPrice').value = "";
          document.getElementById('inName').focus();
          status.innerHTML = `<span class="text-emerald-400 font-bold">Código listo: escribe nombre y precio</span>`;
        }
      }
    }

    function renderCart() {
      const list = document.getElementById('cartList');
      if (cart.length === 0) {
        list.innerHTML = `<div class="text-center text-slate-500 text-xs py-6">Pasa el producto por la cámara o escribe su código arriba.</div>`;
        document.getElementById('txtUSD').textContent = "0.00";
        document.getElementById('txtBS').textContent = "0.00";
        return;
      }

      let total = 0;
      list.innerHTML = cart.map((item, idx) => {
        const sub = item.price * item.qty;
        total += sub;
        return `
          <div class="py-2 flex items-center justify-between text-xs">
            <div class="truncate pr-2">
              <p class="font-bold text-white truncate">${item.name}</p>
              <p class="text-[10px] text-slate-400 font-mono">Cód: ${item.code} | $${item.price.toFixed(2)} c/u</p>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="modifyQty(${idx}, -1)" class="w-6 h-6 rounded bg-slate-700 text-slate-200 font-black">-</button>
              <span class="w-5 text-center font-black text-amber-300">${item.qty}</span>
              <button onclick="modifyQty(${idx}, 1)" class="w-6 h-6 rounded bg-slate-700 text-slate-200 font-black">+</button>
            </div>
            <div class="text-right min-w-[55px] font-black text-white">$${sub.toFixed(2)}</div>
          </div>
        `;
      }).join('');

      document.getElementById('txtUSD').textContent = total.toFixed(2);
      document.getElementById('txtBS').textContent = (total * rate).toFixed(2);
    }

    function modifyQty(i, delta) {
      cart[i].qty += delta;
      if (cart[i].qty <= 0) cart.splice(i, 1);
      renderCart();
    }

    function resetCart() {
      if (cart.length === 0) return;
      if (confirm("¿Vaciar la cuenta actual?")) {
        cart = [];
        renderCart();
      }
    }

    function finishSale() {
      if (cart.length === 0) {
        alert("El carrito está vacío.");
        return;
      }
      const usd = document.getElementById('txtUSD').textContent;
      const bs = document.getElementById('txtBS').textContent;

      if (confirm(`TOTAL A COBRAR:\n$${usd} USD\nBs ${bs}\n\n¿Cobro confirmado?`)) {
        beep();
        alert("✅ Venta registrada.");
        cart = [];
        renderCart();
      }
    }

    function saveItem() {
      const code = document.getElementById('inCode').value.trim();
      const name = document.getElementById('inName').value.trim();
      const cost = parseFloat(document.getElementById('inCost').value) || 0;
      const price = parseFloat(document.getElementById('inPrice').value);

      if (!code || !name || isNaN(price) || price <= 0) {
        alert("Completa código, nombre y precio de venta.");
        return;
      }

      const itemData = { name, cost, price };

      if (db) {
        db.ref('catalogo/' + code).set(itemData, (err) => {
          if (!err) {
            beep();
            alert(`Guardado en la nube: ${name}`);
            document.getElementById('inCode').value = "";
            document.getElementById('inName').value = "";
            document.getElementById('inCost').value = "";
            document.getElementById('inPrice').value = "";
          } else {
            alert("Error al conectar: " + err.message);
          }
        });
      }
    }

    function deleteItem(code) {
      if (confirm(`¿Eliminar producto ${code} de la nube?`)) {
        if (db) db.ref('catalogo/' + code).remove();
      }
    }

    function renderStock() {
      const list = document.getElementById('stockList');
      const keys = Object.keys(catalog);
      document.getElementById('countStock').textContent = keys.length;

      if (keys.length === 0) {
        list.innerHTML = `<div class="text-center py-4 text-slate-500">Sin productos.</div>`;
        return;
      }

      list.innerHTML = keys.map(k => {
        const item = catalog[k];
        return `
          <div class="py-2 flex items-center justify-between text-xs">
            <div class="truncate pr-2">
              <p class="font-bold text-slate-200 truncate">${item.name}</p>
              <p class="text-[10px] text-slate-400 font-mono">Cód: ${k} | Costo: $${item.cost ? item.cost.toFixed(2) : '0.00'}</p>
            </div>
            <div class="flex items-center gap-2">
              <span class="font-black text-amber-400">$${item.price.toFixed(2)}</span>
              <button onclick="deleteItem('${k}')" class="text-red-400 font-bold px-1.5 py-0.5">✕</button>
            </div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
